name: Installation test
on:
  push:
    branches: [main, codex/artifacts-install-ci]
  workflow_dispatch:
    inputs:
      rebuild_package_images:
        description: Build all eleven images from pinned recipes for the fresh installation
        type: boolean
        required: false
        default: false
      cleanup_run_id:
        description: Maintenance only - exact failed fresh-fixture run ID to remove
        type: string
        required: false
        default: ''
      cleanup_attempt_id:
        description: Maintenance only - exact failed fresh-fixture attempt number
        type: string
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  group: pentcloud-installation-test
  cancel-in-progress: false
jobs:
  install:
    name: ${{ (inputs.cleanup_run_id != '' || inputs.cleanup_attempt_id != '') && 'Remove owned fresh fixture' || 'Customer install and upgrade' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    environment: installation-test
    env:
      WRANGLER_SEND_METRICS: 'false'
      CF_SEND_TELEMETRY: 'false'
      DO_NOT_TRACK: '1'
      CREATE_CLOUDFLARE_TELEMETRY_DISABLED: '1'
      PENTCLOUD_CI_REBUILD_IMAGES: ${{ github.event_name == 'workflow_dispatch' && inputs.cleanup_run_id == '' && inputs.cleanup_attempt_id == '' && inputs.rebuild_package_images && '1' || '0' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.12.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.5
          cache: false
      - name: Import and check out exact commit from native Artifacts
        id: artifacts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PENTCLOUD_INSTALL_CONFIG: ${{ secrets.PENTCLOUD_INSTALL_CONFIG }}
        run: node scripts/ci/prepare-source.mjs
      - name: Install locked application dependencies
        working-directory: ${{ steps.artifacts.outputs.source }}
        run: npm ci
      - name: Verify package installation guards
        working-directory: ${{ steps.artifacts.outputs.source }}
        run: node --test scripts/test-package-install.mjs scripts/test-ci-install.mjs scripts/test-customer-cli.mjs scripts/test-customer-config.mjs scripts/test-customer-setup.mjs scripts/test-cleanup-installation.mjs
      - name: Prepare archive reader for pinned pack recipes
        if: ${{ inputs.cleanup_run_id == '' && inputs.cleanup_attempt_id == '' }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libarchive-tools
          mkdir -p "$RUNNER_TEMP/pentcloud-archive-bin"
          ln -s /usr/bin/bsdtar "$RUNNER_TEMP/pentcloud-archive-bin/tar"
          echo "$RUNNER_TEMP/pentcloud-archive-bin" >> "$GITHUB_PATH"
      - name: Prove fresh customer install and retained upgrade
        if: ${{ inputs.cleanup_run_id == '' && inputs.cleanup_attempt_id == '' }}
        working-directory: ${{ steps.artifacts.outputs.source }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PENTCLOUD_INSTALL_CONFIG: ${{ secrets.PENTCLOUD_INSTALL_CONFIG }}
        run: node scripts/ci/install.mjs
      - name: Remove the selected owned empty fresh fixture
        if: ${{ inputs.cleanup_run_id != '' || inputs.cleanup_attempt_id != '' }}
        working-directory: ${{ steps.artifacts.outputs.source }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PENTCLOUD_INSTALL_CONFIG: ${{ secrets.PENTCLOUD_INSTALL_CONFIG }}
          PENTCLOUD_CLEANUP_RUN_ID: ${{ inputs.cleanup_run_id }}
          PENTCLOUD_CLEANUP_ATTEMPT_ID: ${{ inputs.cleanup_attempt_id }}
        run: node scripts/ci/cleanup-installation.mjs
      - name: Reconcile task-owned temporary resources
        if: ${{ always() && inputs.cleanup_run_id == '' && inputs.cleanup_attempt_id == '' }}
        working-directory: ${{ steps.artifacts.outputs.source || github.workspace }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PENTCLOUD_INSTALL_CONFIG: ${{ secrets.PENTCLOUD_INSTALL_CONFIG }}
        run: node scripts/ci/install.mjs --cleanup-only
      # Deliberately no account-log, trace, auth-cache or installation-state upload.

