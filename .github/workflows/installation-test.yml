name: Installation test
on:
  push:
    branches: [main, codex/artifacts-install-ci]
    paths:
      - 'apps/**'
      - 'infra/tool-packs/**'
      - 'shared/**'
      - 'scripts/**'
      - 'templates/private-install/**'
      - 'ci/**'
      - 'package*.json'
      - '.github/workflows/installation-test.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pentcloud-installation-test
  cancel-in-progress: false
jobs:
  install:
    name: Native Artifacts package installation
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    environment: installation-test
    env:
      WRANGLER_SEND_METRICS: 'false'
      CREATE_CLOUDFLARE_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.12.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.5
          cache: false
      - name: Import and check out exact commit from native Artifacts
        id: artifacts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PENTCLOUD_INSTALL_CONFIG: ${{ secrets.PENTCLOUD_INSTALL_CONFIG }}
        run: node scripts/ci/prepare-source.mjs
      - name: Check out pinned tool image recipes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Memrov/PentCloud-tools
          ref: ce1849dce533120307d13c0ab86df919c71787be
          path: tool-source
          persist-credentials: false
      - name: Install locked application dependencies
        working-directory: ${{ steps.artifacts.outputs.source }}
        run: npm ci
      - name: Verify package installation guards
        working-directory: ${{ steps.artifacts.outputs.source }}
        run: node --test scripts/test-package-install.mjs
      - name: Build or reuse verified tool-pack images
        working-directory: ${{ steps.artifacts.outputs.source }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PENTCLOUD_INSTALL_CONFIG: ${{ secrets.PENTCLOUD_INSTALL_CONFIG }}
          PENTCLOUD_TOOLS_DIRECTORY: ${{ github.workspace }}/tool-source
        run: node scripts/ci/images.mjs
      - name: Install and test native services without Kali
        working-directory: ${{ steps.artifacts.outputs.source }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PENTCLOUD_INSTALL_CONFIG: ${{ secrets.PENTCLOUD_INSTALL_CONFIG }}
        run: node scripts/ci/install.mjs
      # Deliberately no account-log, trace, auth-cache or installation-state upload.

