name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      benchmark_url:
        description: 'Optional owned recon fixture HTTPS origin'
        type: string
        default: ''
      fixture_nonce:
        description: 'Nonce from the owned synthetic fixture'
        type: string
        default: ''
      passive_domain:
        description: 'Optional authorized domain for passive discovery'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify
    if: github.event_name != 'workflow_dispatch' || inputs.benchmark_url == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.12.1
          cache: npm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.5
          cache: false # Standard-library-only Go module, with no go.sum.
      - run: npm ci
      - run: npm run verify:full

  browser:
    name: Browser fixtures
    if: github.event_name != 'workflow_dispatch' || inputs.benchmark_url == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.12.1
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chrome
      - run: npm exec --workspace @pentagi-artifacts/control-plane -- vite build
      - run: npm run test:browser

  recon-benchmark:
    name: Owned recon benchmark
    if: github.event_name == 'workflow_dispatch' && inputs.benchmark_url != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      statuses: read
    env:
      BENCH_TARGET: ${{ inputs.benchmark_url }}
      BENCH_NONCE: ${{ inputs.fixture_nonce }}
      BENCH_PASSIVE_DOMAIN: ${{ inputs.passive_domain }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Start synthetic fixture and temporary Cloudflare Tunnel
        id: fixture
        run: python3 benchmarks/recon/fixture.py start
      - name: Publish live synthetic fixture endpoint
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: recon-fixture-endpoint-${{ github.run_attempt }}
          path: fixture-endpoint/
          retention-days: 1
      - name: Verify owned fixture and install pinned binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 benchmarks/recon/runner.py install
      - name: Prepare trial 1
        run: python3 benchmarks/recon/runner.py prepare 1
      - name: HTTP facts 1
        env:
          BENCH_TRIAL: '1'
        run: /home/runner/go/bin/httpx -l benchmark-data/targets.txt -o benchmark-data/httpx-1.jsonl -j -duc -silent -sc -title -server -td -nfs -rl 2 -t 1 -timeout 10 -H User-Agent:PentCloudReconBenchmark
      - name: DNS facts 1
        env:
          BENCH_TRIAL: '1'
        run: /home/runner/go/bin/dnsx -l benchmark-data/hosts.txt -o benchmark-data/dnsx-1.jsonl -j -duc -silent -rl 2 -t 1
      - name: Crawl and record trial 1
        env:
          BENCH_TRIAL: '1'
        run: |
          python3 benchmarks/recon/runner.py katana 1
          python3 benchmarks/recon/runner.py finish-trial 1
      - name: Prepare trial 2
        run: python3 benchmarks/recon/runner.py prepare 2
      - name: HTTP facts 2
        env:
          BENCH_TRIAL: '2'
        run: /home/runner/go/bin/httpx -l benchmark-data/targets.txt -o benchmark-data/httpx-2.jsonl -j -duc -silent -sc -title -server -td -nfs -rl 2 -t 1 -timeout 10 -H User-Agent:PentCloudReconBenchmark
      - name: DNS facts 2
        env:
          BENCH_TRIAL: '2'
        run: /home/runner/go/bin/dnsx -l benchmark-data/hosts.txt -o benchmark-data/dnsx-2.jsonl -j -duc -silent -rl 2 -t 1
      - name: Crawl and record trial 2
        env:
          BENCH_TRIAL: '2'
        run: |
          python3 benchmarks/recon/runner.py katana 2
          python3 benchmarks/recon/runner.py finish-trial 2
      - name: Prepare trial 3
        run: python3 benchmarks/recon/runner.py prepare 3
      - name: HTTP facts 3
        env:
          BENCH_TRIAL: '3'
        run: /home/runner/go/bin/httpx -l benchmark-data/targets.txt -o benchmark-data/httpx-3.jsonl -j -duc -silent -sc -title -server -td -nfs -rl 2 -t 1 -timeout 10 -H User-Agent:PentCloudReconBenchmark
      - name: DNS facts 3
        env:
          BENCH_TRIAL: '3'
        run: /home/runner/go/bin/dnsx -l benchmark-data/hosts.txt -o benchmark-data/dnsx-3.jsonl -j -duc -silent -rl 2 -t 1
      - name: Crawl and record trial 3
        env:
          BENCH_TRIAL: '3'
        run: |
          python3 benchmarks/recon/runner.py katana 3
          python3 benchmarks/recon/runner.py finish-trial 3
      - name: Validate optional passive domain
        run: python3 benchmarks/recon/runner.py domain
      - name: Optional passive discovery
        if: inputs.passive_domain != ''
        env:
          BENCH_TRIAL: passive
        run: /home/runner/go/bin/subfinder -d "$BENCH_PASSIVE_DOMAIN" -o benchmark-data/passive-subfinder.jsonl -json -duc -silent -rl 1 -timeout 5 -max-time 1 -max-results 25
      - name: Summarize benchmark
        run: python3 benchmarks/recon/runner.py finish
      - name: Wait for external Cloudflare benchmark measurements
        if: always() && steps.fixture.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 benchmarks/recon/fixture.py wait
      - name: Stop synthetic fixture and temporary tunnel
        if: always()
        run: python3 benchmarks/recon/fixture.py stop
      - name: Preserve synthetic benchmark evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: owned-recon-benchmark
          path: benchmark-data/
          retention-days: 3
